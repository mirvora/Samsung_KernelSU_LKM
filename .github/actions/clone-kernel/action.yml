name: 'Download Samsung Kernels'
description: "initialize and download the samsung kernel"

runs:
 using: composite
 steps:
   - name: Clone Kernel Source
     if: ${{ !contains(env.BRANCH, 'LOS') }}
     shell: bash
     run: |
      git clone --depth 1 -b $BRANCH --single-branch https://github.com/mirvora/Samsung_Kernels.git $CONFIG

      # Restore kernel_platform/prebuilts and missing patches if prebuilts is missing (stock Samsung source drops omit prebuilts)
      if [ -d "$CONFIG/kernel_platform" ] && [ ! -d "$CONFIG/kernel_platform/prebuilts" ]; then
        echo "::warning::kernel_platform/prebuilts is missing in branch $BRANCH! Fetching fallback prebuilts from SM-S928B-Oneui8.5..."
        git clone --depth 1 -b SM-S928B-Oneui8.5 --single-branch https://github.com/mirvora/Samsung_Kernels.git /tmp/kernel_fallback || \
        git clone --depth 1 -b SM-S928B-Oneui8.5 --single-branch https://github.com/WildKernels/Samsung_Kernels.git /tmp/kernel_fallback
        if [ -d "/tmp/kernel_fallback/kernel_platform/prebuilts" ]; then
          echo "Copying prebuilts into $CONFIG/kernel_platform/prebuilts..."
          cp -r /tmp/kernel_fallback/kernel_platform/prebuilts "$CONFIG/kernel_platform/"

          if [ -f "/tmp/kernel_fallback/kernel_platform/msm-kernel/build_with_bazel.py" ] && ! grep -q "kernel_only" "$CONFIG/kernel_platform/msm-kernel/build_with_bazel.py" 2>/dev/null; then
            echo "Copying patched build_with_bazel.py..."
            cp /tmp/kernel_fallback/kernel_platform/msm-kernel/build_with_bazel.py "$CONFIG/kernel_platform/msm-kernel/"
          fi
          if [ -f "/tmp/kernel_fallback/kernel_platform/build/kernel/android/prepare_vendor.sh" ] && ! grep -q "KERNEL_ONLY" "$CONFIG/kernel_platform/build/kernel/android/prepare_vendor.sh" 2>/dev/null; then
            echo "Copying patched prepare_vendor.sh..."
            cp /tmp/kernel_fallback/kernel_platform/build/kernel/android/prepare_vendor.sh "$CONFIG/kernel_platform/build/kernel/android/"
          fi
        fi
        rm -rf /tmp/kernel_fallback
      fi

   - name: Clone Kernel Source
     if: ${{ contains(env.BRANCH, 'LOS') }}
     shell: bash
     run: |
      #LOSBRANCH, REPO, and CLANG_VER are defined in the kernel-info action!!
      
      git clone --depth 1 -b "$LOSBRANCH" --single-branch "$REPO" $CONFIG

      #setup LOS toolchain
      cd "$CONFIG"
      mkdir -p toolchain/clang/host/linux-x86
      cd toolchain/clang/host/linux-x86
      git clone --depth 1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 aosp-clang
      cd aosp-clang
      git sparse-checkout set "$CLANG_VER"
      
